# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # pkgdown renders every top-level .md file as a site page, and neither
      # _pkgdown.yml nor .Rbuildignore can opt one out -- pkgdown::package_mds()
      # skips a hardcoded list only. Delete the agent instructions from this
      # throwaway checkout so the pages are never generated, which also keeps
      # them out of the sitemap and the search index.
      - name: Keep agent instructions off the site
        run: rm -f CLAUDE.md AGENTS.md

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        # The coverage workflow commits badges/coverage.svg to gh-pages too.
        # `clean: false` keeps it, and `force: false` rebases onto a badge
        # commit that lands mid-deploy instead of overwriting it.
        with:
          clean: false
          force: false
          branch: gh-pages
          folder: docs
