on:
  # No `push:`. A pull request already checks its merge with main, so the
  # push after merge would check the same tree again. Main is checked by the
  # schedule below, which skips a commit it has already checked (r-actions
  # README, "Pushes to main").
  # `labeled`/`unlabeled` so that adding or removing a CI label (`full-ci`,
  # `ci:minimal`, `skip-ci:<workflow>`) reruns it.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The full set (CRAN-like containers, nosuggests) runs weekly and on
  # demand: `gh workflow run R-CMD-check.yaml --ref main`.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Documentation-only pull requests skip this job through r-actions'
  # `skip-docs-only` gate (default true), which replaces the old
  # always-run matrix (#29).
  R-CMD-check:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      # Quick on pull requests. Full on the weekly schedule, on a manual
      # dispatch, and on a pull request labelled `full-ci`.
      profile: auto
      # CRAN's NOSUGGESTS flavor: arrow, data.table, dplyr, tidyr, stringi
      # and the rest are all optional, so check the package without them.
      nosuggests: true
