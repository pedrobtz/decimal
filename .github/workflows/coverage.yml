on:
  push:
    branches: [main, master]
  pull_request:

name: coverage

jobs:
  coverage:
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@v1
    permissions:
      contents: write
    # main takes changes only through pull requests, so the badge commit goes
    # to gh-pages, which pkgdown already deploys to without force-pushing.
    with:
      badge-branch: gh-pages
      badge-path: badges/coverage.svg
