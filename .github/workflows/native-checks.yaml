on:
  workflow_dispatch:

name: native-checks

# Required, not optional. The repository's default GITHUB_TOKEN permission is
# `read`, which is narrower than the `read-all` these reusable workflows
# declare, and a called workflow cannot be granted more than its caller holds.
# Without this block every job is rejected before it starts: the run ends in
# `startup_failure` after two seconds with no jobs and no annotation, which
# looks like an outage rather than a configuration error. Every other workflow
# here already declares permissions, which is why only this one was affected.
permissions: read-all

jobs:
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@v1

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  gctorture:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@v1

  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1
