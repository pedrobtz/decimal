on:
  push:
    branches: [main, master]
  pull_request:

name: native-checks

permissions: read-all

jobs:
  sanitizers:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      CC: clang
      CXX: clang++
      CFLAGS: -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer
      CXXFLAGS: -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer
      LDFLAGS: -fsanitize=address,undefined
      ASAN_OPTIONS: detect_leaks=1:strict_init_order=1
      UBSAN_OPTIONS: print_stacktrace=1

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          http-user-agent: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Run R CMD check with sanitizers
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran"),
            build_args = c("--no-manual"),
            error_on = "warning"
          )

  valgrind:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Run R CMD check under valgrind
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran", "--use-valgrind"),
            build_args = c("--no-manual"),
            error_on = "warning"
          )

  # Link-Time Optimization: compiles the whole package (our C plus the vendored
  # mpdecimal sources) with -flto so the toolchain cross-checks declarations
  # against definitions across translation units. Catches signature mismatches
  # between init.c, core.c, and the mpdecimal headers that ordinary checks miss.
  # Mirrors CRAN's LTO "Additional issue" flavor.
  lto:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_LTO_: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          http-user-agent: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Enable LTO
        run: |
          mkdir -p ~/.R
          printf 'LTO = -flto\nLTO_FC = -flto\n' >> ~/.R/Makevars

      - name: Run R CMD check with LTO
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran"),
            build_args = c("--no-manual"),
            error_on = "warning"
          )

  # gctorture: force a garbage collection at every allocation while running the
  # test suite, so any missing PROTECT in the C code corrupts memory immediately
  # and surfaces as a test failure or crash. This is the runtime complement to
  # the static rchk job below. Slow by design.
  gctorture:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          http-user-agent: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::pkgload
          needs: check

      - name: Run tests under gctorture
        shell: Rscript {0}
        run: |
          gctorture(TRUE)
          testthat::test_local(stop_on_failure = TRUE)

  # rchk: Tomas Kalibera's static analyzer for the R C API. Proves PROTECT-stack
  # correctness (unprotected SEXPs live across allocating calls, imbalanced
  # PROTECT/UNPROTECT) that neither R CMD check nor the sanitizers detect.
  # Mirrors CRAN's rchk "Additional issue" flavor. Informational: it annotates
  # findings and uploads the report rather than hard-failing, since rchk can
  # report false positives that need human judgement.
  rchk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Build source tarball
        run: R CMD build --no-build-vignettes --no-manual .

      - name: Run rchk in Docker
        run: |
          mkdir -p rchk-packages
          mv decimal_*.tar.gz rchk-packages/
          tarball=$(ls rchk-packages)
          docker run --rm -v "$(pwd)/rchk-packages":/rchk/packages \
            kalibera/rchk:latest "/rchk/packages/${tarball}" | tee rchk-output.txt
          echo "----- rchk summary -----"
          if grep -E "Function |unprotected|negative depth|imbalanced|too many" rchk-output.txt; then
            echo "::warning::rchk reported potential PROTECT issues; review the rchk-output artifact"
          else
            echo "rchk found no PROTECT issues."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rchk-output
          path: rchk-output.txt
