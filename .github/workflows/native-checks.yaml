on:
  workflow_dispatch:

  # Gate the C, and only the C. These jobs take about seventeen minutes in
  # parallel -- gctorture is essentially all of it -- which is worth paying on
  # a change to src/ and worth paying on nothing else, so a vignette or a
  # roxygen edit still gets the ordinary checks and nothing more.
  #
  # Dispatch-only was the previous arrangement, and it meant this ran when
  # somebody remembered. Nobody did: the workflow was failing at startup from
  # June until September without one run, and the leak it would have caught
  # sat in the parse path for that whole time.
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/native-checks.yaml"

name: native-checks

# These workflows only read. Declaring that here rather than inheriting it
# keeps the grant visible at the call site, and keeps this caller working if
# they ever ask for something wider again -- which is what broke it before:
# they declared `read-all`, a called workflow cannot be granted more than its
# caller holds, and the run died as `startup_failure` two seconds in with no
# jobs and no annotation to explain it. r-actions v1.10.0 narrowed them to
# `contents: read`, so this now matches what they use.
permissions:
  contents: read

jobs:
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@v1

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  gctorture:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@v1

  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1
