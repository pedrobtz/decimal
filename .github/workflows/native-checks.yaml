on:
  workflow_dispatch:

  # Gate the C, and only the C. These jobs take about seventeen minutes in
  # parallel, nearly all of it gctorture, which is worth paying on a change to
  # src/ and on nothing else: a vignette or roxygen edit still gets the
  # ordinary checks and nothing more.
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/native-checks.yaml"

name: native-checks

# The called workflows declare `contents: read` (r-actions >= 1.10.0), and a
# caller cannot grant a called workflow more than it holds itself. Declaring
# the same grant here keeps it visible at the call site. A mismatch fails the
# run as `startup_failure` with no jobs and no annotation, so if r-actions
# ever widens its permissions, this block must widen with it.
permissions:
  contents: read

jobs:
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@v1

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  gctorture:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@v1

  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1
